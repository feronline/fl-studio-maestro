[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-maestro"
version = "0.5.0"
description = "Multi-agent music production with Claude: describe a track, get a mixed and mastered MP3 + MIDI. Optional live FL Studio control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "feronline" }]
keywords = ["fl-studio", "mcp", "music-production", "midi", "claude-code", "ai-music"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]
dependencies = ["mcp>=2.3,<3", "pydantic>=2", "numpy>=1.26", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/feronline/fl-studio-maestro"
Issues = "https://github.com/feronline/fl-studio-maestro/issues"

[project.scripts]
fl-maestro = "fl_maestro.cli:main"
fl-maestro-mcp = "fl_maestro.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_maestro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
